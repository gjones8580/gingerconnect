[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gingerconnect"
version = "0.1.0"
description = "A PyQt6 desktop client for RDP and SSH connections with CyberArk SIA support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["rdp", "ssh", "cyberark", "sia", "remote-access", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.4.0",
    "paramiko>=3.0.0",
    "pyte>=0.8.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
gingerconnect = "gingerconnect.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gingerconnect*"]

[tool.setuptools.package-data]
gingerconnect = ["../GingerConnect.png"]
