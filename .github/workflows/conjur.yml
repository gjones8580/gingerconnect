name: conjur-poc
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  test-conjur:
    runs-on: ubuntu-latest
    steps:
      - name: Debug — raw JWT auth against Conjur Cloud
        run: |
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          echo "JWT length: ${#JWT}"

          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "---- decoded claims ----"
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, repository_id, repository_owner, workflow, ref}'
          echo "-------------------------"

          STATUS=$(curl -sS -D /tmp/headers.txt -o /tmp/authn_body.txt -w "%{http_code}" \
            --data-urlencode "jwt=${JWT}" \
            "https://csse.secretsmgr.cyberark.cloud/api/authn-jwt/github/conjur/authenticate")

          echo "Authenticate HTTP status: $STATUS"
          echo "---- response headers ----"
          cat /tmp/headers.txt
          echo "---- response body ----"
          cat /tmp/authn_body.txt
          echo "---------------------------"

      - name: Fetch secret from Conjur Cloud
        uses: cyberark/conjur-action@v2.2.2
        with:
          url: https://csse.secretsmgr.cyberark.cloud
          account: conjur
          authn_id: github
          secrets: data/vault/GJ-SpringBoot/demouser-postgres/password|TEST_SECRET

      - name: Prove it worked
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "✅ Retrieved secret, length: ${#TEST_SECRET}"
          else
            echo "❌ Secret was empty"
            exit 1
          fi
